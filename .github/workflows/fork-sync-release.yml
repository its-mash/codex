name: fork-sync-release

# Keep this fork riding on top of openai/codex and publish installable releases.
#
#   schedule / manual  -> merge openai/codex main into this fork's main
#       clean merge     -> push, then build + publish a GitHub Release
#       conflict        -> open/refresh an issue with local-fix steps, fail the run
#   push to main       -> (your conflict fix lands here) build + publish if HEAD is unreleased
#
# The local machine only consumes the published Release (see fork-tools/codex-update.sh),
# exactly like the official codex auto-update flow.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      force_release:
        description: "Build + publish a release even if HEAD is already released"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "design/**"
      - "fork-tools/**"
      - "**/*.md"

concurrency:
  group: fork-sync-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_URL: https://github.com/openai/codex.git
  TARGET_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.state.outputs.head_sha }}
      short_sha: ${{ steps.state.outputs.short_sha }}
    steps:
      - name: Checkout fork main (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "fork-sync-bot"
          git config user.email "fork-sync-bot@users.noreply.github.com"
          git config rerere.enabled true

      - name: Merge latest openai/codex
        # Runs on schedule/dispatch. Also on a push whose commit message contains
        # `[sync]`, which is the manual trigger when workflow_dispatch is not
        # available (e.g. a non-admin token). Ordinary pushes skip the merge.
        if: >-
          github.event_name != 'push' ||
          contains(github.event.head_commit.message, '[sync]')
        id: merge
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --prune upstream main
          behind="$(git rev-list --count HEAD..upstream/main)"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" = "0" ]; then
            echo "Already up to date with openai/codex."
            exit 0
          fi
          echo "Merging $behind upstream commit(s)."
          if git merge --no-edit upstream/main; then
            echo "Clean merge."
            git push origin main
          else
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd', ' - || true)"
            git merge --abort || true
            {
              echo "conflict=1"
              echo "conflicts<<EOF"
              echo "$conflicts"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Report sync conflict (run summary + failed run = notification)
        # The fork has Issues disabled and the token is not a repo admin, so the
        # conflict alert is the failed scheduled-run email GitHub sends the owner,
        # and the fix steps are written to the run summary. No Issues needed.
        if: failure() && steps.merge.outputs.conflict == '1'
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          BEHIND: ${{ steps.merge.outputs.behind }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ⚠️ Upstream sync conflict — auto-sync paused

          The fork could not merge \`openai/codex\` main cleanly, so this run failed
          (you get the failed-run email). Resolve it locally and the next run resumes.

          - **Conflicting files:** ${CONFLICTS:-<none reported>}
          - **Upstream commits behind:** ${BEHIND:-?}

          ### Resolve locally
          \`\`\`bash
          cd /home/benty/codex
          git fetch upstream main            # remote 'upstream' -> openai/codex
          git merge upstream/main            # resolve the conflicts it reports
          git add -A && git commit           # completes the merge
          git push origin main               # this push builds + publishes a release
          \`\`\`
          rerere is enabled, so a conflict you resolve once replays automatically
          on future syncs.
          EOF
          echo "::error::Upstream sync conflict in: ${CONFLICTS:-<none>} — see the run summary."

      - name: Record HEAD
        id: state
        run: |
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout synced main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether a release is needed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          echo "short_sha=$short" >> "$GITHUB_OUTPUT"
          echo "tag=fork-$(date -u +%Y%m%d-%H%M%S)-$short" >> "$GITHUB_OUTPUT"
          echo "upstream_base=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${FORCE:-false}" = "true" ]; then
            echo "needed=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Idempotent: skip if a release for this exact HEAD already exists.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
              --json tagName --jq '.[].tagName' 2>/dev/null | grep -q -- "-$short\$"; then
            echo "HEAD $short already released; skipping."
            echo "needed=0" >> "$GITHUB_OUTPUT"
          else
            echo "needed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.decide.outputs.needed == '1'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        if: steps.decide.outputs.needed == '1'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          # Keep the (expensive) dependency compile even when a later step fails
          # — e.g. the rusty_v8 link — so the next run resumes warm instead of
          # recompiling the whole workspace from scratch.
          cache-on-failure: true
          # v2: drop the earlier cache that baked a per-run RUNNER_TEMP path for
          # the rusty_v8 archive into the cached v8 build (stale path -> link
          # failure on restore). The archive path is stabilized below so this
          # key stays valid from here on.
          prefix-key: fork-release-v2

      - name: Set up Codex-built rusty_v8
        # codex-code-mode-host links V8; the default rusty_v8 prebuilt archive is
        # not published for this profile, so use openai/codex's rusty-v8-v* release
        # artifacts (this sets RUSTY_V8_ARCHIVE + RUSTY_V8_SRC_BINDING_PATH).
        if: steps.decide.outputs.needed == '1'
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ env.TARGET_TRIPLE }}

      - name: Stabilize rusty_v8 archive path (cache-safe)
        # setup-rusty-v8 places the archive under RUNNER_TEMP, which differs every
        # run; the v8 crate bakes that path into its (cached) build output, so a
        # restored cache points at a dead path. Copy to a fixed, run-independent
        # location and re-export, so the cached v8 build stays valid across runs.
        if: steps.decide.outputs.needed == '1'
        run: |
          set -euo pipefail
          stable="$HOME/.fork-rusty-v8"
          mkdir -p "$stable"
          cp -f "$RUSTY_V8_ARCHIVE" "$stable/"
          cp -f "$RUSTY_V8_SRC_BINDING_PATH" "$stable/"
          echo "RUSTY_V8_ARCHIVE=$stable/$(basename "$RUSTY_V8_ARCHIVE")" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$stable/$(basename "$RUSTY_V8_SRC_BINDING_PATH")" >> "$GITHUB_ENV"

      - name: Force fresh rusty_v8 link artifact (cache-safe)
        # A restored cache marks the v8 crate as already built, so its build
        # script does not re-run — but rust-cache does not preserve the 155 MB
        # librusty_v8.a in v8's build-output dir, so the final link fails with
        # "could not find native static library rusty_v8". Clean only v8 so its
        # build script re-materializes the archive (seconds); the rest of the
        # cached workspace/deps compile is kept.
        if: steps.decide.outputs.needed == '1'
        working-directory: codex-rs
        run: cargo clean --release -p v8 || true

      - name: Build release binaries
        if: steps.decide.outputs.needed == '1'
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --release --locked --bin codex -p codex-cli
          cargo build --release --locked --bin codex-code-mode-host -p codex-code-mode-host

      - name: Package standalone tarball
        if: steps.decide.outputs.needed == '1'
        id: package
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          pkg="codex-${TAG}-${TARGET_TRIPLE}"
          mkdir -p "dist/${pkg}/bin"
          cp codex-rs/target/release/codex "dist/${pkg}/bin/"
          cp codex-rs/target/release/codex-code-mode-host "dist/${pkg}/bin/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          ( cd dist && sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256" )
          echo "artifact=dist/${pkg}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${pkg}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.decide.outputs.needed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
          SHORT: ${{ steps.decide.outputs.short_sha }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          Automated fork release built from this fork's \`main\` at commit \`${SHORT}\`,
          which tracks the latest \`openai/codex\` main plus this fork's changes.

          Target: \`${TARGET_TRIPLE}\`. Install/update locally with
          \`fork-tools/codex-update.sh\` (or its systemd timer), which swaps
          \`~/.codex/packages/standalone/current\` to this build.
          EOF
          )
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "$notes" \
            "${{ steps.package.outputs.artifact }}" \
            "${{ steps.package.outputs.checksum }}"
