name: fork-sync-release

# Keep this fork riding on top of openai/codex and publish installable releases
# for Linux amd64 and Windows amd64.
#
#   schedule / manual  -> merge the latest STABLE openai/codex release (tag from
#                         releases/latest; alpha prereleases are ignored) into
#                         this fork's main. Upstream commits without a new
#                         release do NOT trigger a sync.
#       clean merge     -> push, then build + publish a GitHub Release
#       conflict        -> write fix steps to the run summary, fail the run (email)
#   push to main       -> (your conflict fix lands here) build + publish if HEAD is
#                         unreleased AND codex-rs/ changed since the last release
#
# Each platform uploads its own assets as soon as it finishes building, so the
# faster Linux build is never gated behind the slower Windows one.
#
# The local machine only consumes the published Release (see fork-tools/), exactly
# like the official codex auto-update flow.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      force_release:
        description: "Build + publish a release even if HEAD is already released"
        type: boolean
        default: false
  push:
    branches: [main]
    # None of these land in a binary, so they must never cost a build. Workflow
    # edits included: they are exercised by the next scheduled run, and `prepare`
    # skips the build anyway when codex-rs/ is unchanged since the last release.
    paths-ignore:
      - "design/**"
      - "fork-tools/**"
      - ".github/workflows/**"
      - "**/*.md"

concurrency:
  group: fork-sync-release
  # A newer push supersedes an in-flight push run (its build is already stale).
  # Scheduled syncs are never cancelled: they may be mid-merge/push of upstream.
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

env:
  UPSTREAM_URL: https://github.com/openai/codex.git

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.state.outputs.head_sha }}
      short_sha: ${{ steps.state.outputs.short_sha }}
    steps:
      - name: Checkout fork main (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "fork-sync-bot"
          git config user.email "fork-sync-bot@users.noreply.github.com"
          git config rerere.enabled true

      - name: Merge latest openai/codex release
        # Runs on schedule/dispatch. Also on a push whose commit message contains
        # `[sync]`, which is the manual trigger when workflow_dispatch is not
        # available (e.g. a non-admin token). Ordinary pushes skip the merge.
        #
        # Sync policy: track the latest STABLE upstream release only
        # (`gh release view` resolves releases/latest, which excludes prereleases
        # and drafts — codex's near-daily `rust-v*-alpha.*` tags never match).
        # Upstream main commits without a new release are intentionally ignored.
        if: >-
          github.event_name != 'push' ||
          contains(github.event.head_commit.message, '[sync]')
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          release_tag="$(gh release view --repo openai/codex --json tagName --jq .tagName)"
          if [ -z "$release_tag" ]; then
            echo "::error::Could not resolve the latest openai/codex release."
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          git fetch --no-tags upstream "refs/tags/${release_tag}:refs/tags/${release_tag}"
          tag_commit="$(git rev-parse "${release_tag}^{commit}")"
          # Upstream cuts a release as a side commit off main whose ONLY change is
          # the workspace version stamp (`version = "0.0.0"` -> `"0.147.0"`; verified
          # for v0.145.0..v0.147.0). Merge the commit that release was cut FROM: the
          # fork then tracks exactly the released code, while not importing a version
          # line the fork does not use and which would otherwise conflict on every
          # later release (base 0.0.0 vs ours 0.147.0 vs theirs 0.148.0). If a release
          # commit ever carries real content, merge the release commit itself.
          stamp_only="$(git show --pretty=format: --name-only "$tag_commit" | grep -v '^$' | paste -sd, -)"
          if [ "$stamp_only" = "codex-rs/Cargo.toml" ]; then
            release_commit="$(git rev-parse "${tag_commit}^1")"
            echo "Release ${release_tag} is a version stamp; syncing its release point $release_commit."
          else
            release_commit="$tag_commit"
            echo "Release ${release_tag} carries content ($stamp_only); syncing the release commit."
          fi
          if git merge-base --is-ancestor "$release_commit" HEAD; then
            echo "Already contains upstream release ${release_tag}; nothing to sync."
            exit 0
          fi
          behind="$(git rev-list --count "HEAD..${release_commit}")"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Merging upstream release ${release_tag} ($behind commit(s))."
          if git merge --no-edit -m "Merge upstream release ${release_tag}" "$release_commit"; then
            echo "Clean merge of ${release_tag}."
            git push origin main
          else
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd', ' - || true)"
            git merge --abort || true
            {
              echo "conflict=1"
              echo "conflicts<<EOF"
              echo "$conflicts"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Report sync conflict (run summary + failed run = notification)
        # The fork has Issues disabled and the token is not a repo admin, so the
        # conflict alert is the failed scheduled-run email GitHub sends the owner,
        # and the fix steps are written to the run summary. No Issues needed.
        if: failure() && steps.merge.outputs.conflict == '1'
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          BEHIND: ${{ steps.merge.outputs.behind }}
          RELEASE_TAG: ${{ steps.merge.outputs.release_tag }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ⚠️ Upstream sync conflict — auto-sync paused

          The fork could not merge the upstream release \`${RELEASE_TAG:-?}\` cleanly, so
          this run failed (you get the failed-run email). Resolve it locally and the
          next run resumes.

          - **Conflicting files:** ${CONFLICTS:-<none reported>}
          - **Upstream commits behind:** ${BEHIND:-?}

          ### Resolve locally
          \`\`\`bash
          cd /home/benty/codex
          tag=${RELEASE_TAG:-<tag>}
          git fetch --no-tags upstream "refs/tags/\$tag:refs/tags/\$tag"
          git merge "\$tag^1"                # the release point; resolve the conflicts
          git add -A && git commit           # completes the merge
          git push origin main               # this push builds + publishes a release
          \`\`\`
          rerere is enabled, so a conflict you resolve once replays automatically
          on future syncs.
          EOF
          echo "::error::Upstream sync conflict in: ${CONFLICTS:-<none>} — see the run summary."

      - name: Record HEAD
        id: state
        run: |
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  prepare:
    needs: sync
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      tag: ${{ steps.decide.outputs.tag }}
      short_sha: ${{ steps.decide.outputs.short_sha }}
    steps:
      - name: Checkout synced main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether a release is needed and compute the shared tag
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          echo "short_sha=$short" >> "$GITHUB_OUTPUT"
          echo "tag=fork-$(date -u +%Y%m%d-%H%M%S)-$short" >> "$GITHUB_OUTPUT"
          if [ "${FORCE:-false}" = "true" ]; then
            echo "needed=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Idempotent: skip if a release for this exact HEAD already exists.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
              --json tagName --jq '.[].tagName' 2>/dev/null | grep -q -- "-$short\$"; then
            echo "HEAD $short already released; skipping."
            echo "needed=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Nothing that lands in a binary changed since the last release? Then a
          # rebuild would be byte-for-byte pointless (docs, workflow, fork-tools
          # commits) — a full build is ~35-70 min, so skip it.
          last="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                    --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          last_sha="${last##*-}"
          if [ -n "$last_sha" ] && git cat-file -e "${last_sha}^{commit}" 2>/dev/null \
             && git diff --quiet "$last_sha" HEAD -- codex-rs; then
            echo "No codex-rs/ changes since ${last}; skipping build."
            echo "needed=0" >> "$GITHUB_OUTPUT"
          else
            echo "needed=1" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.needed == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      # The fork's packaging copies binaries as-is and archives no sidecar
      # symbols, so upstream's release debug info is pure cost here: it made
      # `codex` 1.2 GB of which only 238 MB is code. Dropping debug info and
      # thin LTO (and raising codegen-units) is the difference between a ~35-70
      # min build and roughly half that, and shrinks the download users pull.
      # Trade-off: panics lose file:line, binaries are slightly larger/slower.
      # To restore upstream behaviour, delete these three variables.
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout synced main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          # Keep the (expensive) dependency compile even when a later step fails.
          # rust-cache keys per OS/arch, so Linux and Windows caches never collide.
          cache-on-failure: true
          prefix-key: fork-release-v2

      - name: Set up Codex-built rusty_v8
        # codex-code-mode-host links V8; the default rusty_v8 prebuilt archive is
        # not published for this profile, so use openai/codex's rusty-v8-v* release
        # artifacts. Handles both the Linux `.a.gz` and Windows `.lib.gz` profiles
        # and sets RUSTY_V8_ARCHIVE + RUSTY_V8_SRC_BINDING_PATH.
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Force fresh rusty_v8 link artifact (cache-safe)
        # A restored cache marks the v8 crate as already built, so its build script
        # does not re-run — but rust-cache does not preserve v8's large static lib
        # in its build-output dir, so the final link fails with "could not find
        # native static library rusty_v8". Clean only v8 so its build script
        # re-materializes the archive (seconds) with this run's RUSTY_V8_ARCHIVE;
        # the rest of the cached workspace/deps compile is kept.
        shell: bash
        working-directory: codex-rs
        run: cargo clean --release --target ${{ matrix.target }} -p v8 || true

      - name: Build release binaries
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --release --locked --target ${{ matrix.target }} --bin codex -p codex-cli
          cargo build --release --locked --target ${{ matrix.target }} --bin codex-code-mode-host -p codex-code-mode-host

      - name: Package standalone archive
        id: package
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          exe=""; [ "$ARCHIVE" = "zip" ] && exe=".exe"
          pkg="codex-${TAG}-${TARGET}"
          mkdir -p "dist/${pkg}/bin"
          cp "codex-rs/target/${TARGET}/release/codex${exe}" "dist/${pkg}/bin/"
          cp "codex-rs/target/${TARGET}/release/codex-code-mode-host${exe}" "dist/${pkg}/bin/"
          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "${pkg}.zip" "${pkg}" >/dev/null
            asset="${pkg}.zip"
          else
            tar -czf "${pkg}.tar.gz" "${pkg}"
            asset="${pkg}.tar.gz"
          fi
          sha256sum "$asset" > "${asset}.sha256"
          echo "Packaged ${asset}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 2

      - name: Publish this platform's assets
        # Each platform ships the moment it is built instead of waiting for the
        # other: Linux (~2x faster than Windows) no longer sits idle behind the
        # Windows build, so the machine that consumes it can update much sooner.
        # Release creation is idempotent — whichever platform finishes first
        # creates it, the other just uploads into it.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHORT: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          notes="Automated fork release built from this fork's \`main\` at commit \`${SHORT}\`,
          which tracks the latest stable \`openai/codex\` release plus this fork's changes.

          Assets are uploaded per platform as each build finishes:
          - Linux amd64: \`*-x86_64-unknown-linux-gnu.tar.gz\`
          - Windows amd64: \`*-x86_64-pc-windows-msvc.zip\`

          A platform whose build failed is simply absent (the run is marked failed).
          Install / use on both platforms: see \`fork-tools/README.md\`."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "$notes" 2>/dev/null \
            || echo "Release $TAG already exists; uploading into it."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
