name: fork-sync-release

# Keep this fork riding on top of openai/codex and publish installable releases
# for Linux amd64 and Windows amd64.
#
#   schedule / manual  -> merge openai/codex main into this fork's main
#       clean merge     -> push, then build + publish a GitHub Release
#       conflict        -> write fix steps to the run summary, fail the run (email)
#   push to main       -> (your conflict fix lands here) build + publish if HEAD is unreleased
#
# The local machine only consumes the published Release (see fork-tools/), exactly
# like the official codex auto-update flow.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      force_release:
        description: "Build + publish a release even if HEAD is already released"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "design/**"
      - "fork-tools/**"
      - "**/*.md"

concurrency:
  group: fork-sync-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_URL: https://github.com/openai/codex.git

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.state.outputs.head_sha }}
      short_sha: ${{ steps.state.outputs.short_sha }}
    steps:
      - name: Checkout fork main (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "fork-sync-bot"
          git config user.email "fork-sync-bot@users.noreply.github.com"
          git config rerere.enabled true

      - name: Merge latest openai/codex
        # Runs on schedule/dispatch. Also on a push whose commit message contains
        # `[sync]`, which is the manual trigger when workflow_dispatch is not
        # available (e.g. a non-admin token). Ordinary pushes skip the merge.
        if: >-
          github.event_name != 'push' ||
          contains(github.event.head_commit.message, '[sync]')
        id: merge
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --prune upstream main
          behind="$(git rev-list --count HEAD..upstream/main)"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" = "0" ]; then
            echo "Already up to date with openai/codex."
            exit 0
          fi
          echo "Merging $behind upstream commit(s)."
          if git merge --no-edit upstream/main; then
            echo "Clean merge."
            git push origin main
          else
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd', ' - || true)"
            git merge --abort || true
            {
              echo "conflict=1"
              echo "conflicts<<EOF"
              echo "$conflicts"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Report sync conflict (run summary + failed run = notification)
        # The fork has Issues disabled and the token is not a repo admin, so the
        # conflict alert is the failed scheduled-run email GitHub sends the owner,
        # and the fix steps are written to the run summary. No Issues needed.
        if: failure() && steps.merge.outputs.conflict == '1'
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          BEHIND: ${{ steps.merge.outputs.behind }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ⚠️ Upstream sync conflict — auto-sync paused

          The fork could not merge \`openai/codex\` main cleanly, so this run failed
          (you get the failed-run email). Resolve it locally and the next run resumes.

          - **Conflicting files:** ${CONFLICTS:-<none reported>}
          - **Upstream commits behind:** ${BEHIND:-?}

          ### Resolve locally
          \`\`\`bash
          cd /home/benty/codex
          git fetch upstream main            # remote 'upstream' -> openai/codex
          git merge upstream/main            # resolve the conflicts it reports
          git add -A && git commit           # completes the merge
          git push origin main               # this push builds + publishes a release
          \`\`\`
          rerere is enabled, so a conflict you resolve once replays automatically
          on future syncs.
          EOF
          echo "::error::Upstream sync conflict in: ${CONFLICTS:-<none>} — see the run summary."

      - name: Record HEAD
        id: state
        run: |
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  prepare:
    needs: sync
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      tag: ${{ steps.decide.outputs.tag }}
      short_sha: ${{ steps.decide.outputs.short_sha }}
    steps:
      - name: Checkout synced main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether a release is needed and compute the shared tag
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          echo "short_sha=$short" >> "$GITHUB_OUTPUT"
          echo "tag=fork-$(date -u +%Y%m%d-%H%M%S)-$short" >> "$GITHUB_OUTPUT"
          if [ "${FORCE:-false}" = "true" ]; then
            echo "needed=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Idempotent: skip if a release for this exact HEAD already exists.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
              --json tagName --jq '.[].tagName' 2>/dev/null | grep -q -- "-$short\$"; then
            echo "HEAD $short already released; skipping."
            echo "needed=0" >> "$GITHUB_OUTPUT"
          else
            echo "needed=1" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.needed == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout synced main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          # Keep the (expensive) dependency compile even when a later step fails.
          # rust-cache keys per OS/arch, so Linux and Windows caches never collide.
          cache-on-failure: true
          prefix-key: fork-release-v2

      - name: Set up Codex-built rusty_v8
        # codex-code-mode-host links V8; the default rusty_v8 prebuilt archive is
        # not published for this profile, so use openai/codex's rusty-v8-v* release
        # artifacts. Handles both the Linux `.a.gz` and Windows `.lib.gz` profiles
        # and sets RUSTY_V8_ARCHIVE + RUSTY_V8_SRC_BINDING_PATH.
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Force fresh rusty_v8 link artifact (cache-safe)
        # A restored cache marks the v8 crate as already built, so its build script
        # does not re-run — but rust-cache does not preserve v8's large static lib
        # in its build-output dir, so the final link fails with "could not find
        # native static library rusty_v8". Clean only v8 so its build script
        # re-materializes the archive (seconds) with this run's RUSTY_V8_ARCHIVE;
        # the rest of the cached workspace/deps compile is kept.
        shell: bash
        working-directory: codex-rs
        run: cargo clean --release --target ${{ matrix.target }} -p v8 || true

      - name: Build release binaries
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --release --locked --target ${{ matrix.target }} --bin codex -p codex-cli
          cargo build --release --locked --target ${{ matrix.target }} --bin codex-code-mode-host -p codex-code-mode-host

      - name: Package standalone archive
        id: package
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          exe=""; [ "$ARCHIVE" = "zip" ] && exe=".exe"
          pkg="codex-${TAG}-${TARGET}"
          mkdir -p "dist/${pkg}/bin"
          cp "codex-rs/target/${TARGET}/release/codex${exe}" "dist/${pkg}/bin/"
          cp "codex-rs/target/${TARGET}/release/codex-code-mode-host${exe}" "dist/${pkg}/bin/"
          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "${pkg}.zip" "${pkg}" >/dev/null
            asset="${pkg}.zip"
          else
            tar -czf "${pkg}.tar.gz" "${pkg}"
            asset="${pkg}.tar.gz"
          fi
          sha256sum "$asset" > "${asset}.sha256"
          echo "Packaged ${asset}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [prepare, build]
    # always() so a single-platform build failure still ships the platform that
    # succeeded (the run still reports failure -> notification email). Skips only
    # when no release is needed or nothing built.
    if: always() && needs.prepare.outputs.needed == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHORT: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No build artifacts to publish (all platform builds failed)."
            exit 0
          fi
          have_linux=$(printf '%s\n' "${files[@]}" | grep -c 'x86_64-unknown-linux-gnu.tar.gz$' || true)
          have_windows=$(printf '%s\n' "${files[@]}" | grep -c 'x86_64-pc-windows-msvc.zip$' || true)
          notes=$(cat <<EOF
          Automated fork release built from this fork's \`main\` at commit \`${SHORT}\`,
          which tracks the latest \`openai/codex\` main plus this fork's changes.

          Assets in this release:
          - Linux amd64 (\`x86_64-unknown-linux-gnu\`): $( [ "$have_linux" != 0 ] && echo 'included (.tar.gz)' || echo 'MISSING — build failed' )
          - Windows amd64 (\`x86_64-pc-windows-msvc\`): $( [ "$have_windows" != 0 ] && echo 'included (.zip)' || echo 'MISSING — build failed' )

          Install / use on both platforms: see \`fork-tools/README.md\`.
          EOF
          )
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "$notes" \
            "${files[@]}"
